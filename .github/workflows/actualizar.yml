name: Actualizar datos

on:
  schedule:
    - cron: "23 * * * *"   # cada hora, al minuto 23 (UTC)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer la red
        run: python3 indexer.py
        env:
          ELYSIUM_RPC: ${{ secrets.ELYSIUM_RPC || 'https://rpc.elysium.kinetiq.xyz' }}
      - name: Generar tablas
        run: python3 build_datasets.py
      - name: Guardar cambios
        run: |
          git config user.name "pulso-elysium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json docs/data
          git diff --cached --quiet || git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
